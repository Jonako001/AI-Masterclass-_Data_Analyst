<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Day 4 - Fetch Exercise</title>
<style>
  body{font-family:Arial;max-width:600px;margin:60px auto;padding:20px;background:#f5f7fb}
  h1{color:#1F4E79;text-align:center}
  .row{display:flex;gap:10px;justify-content:center}
  input{padding:12px;width:300px;border-radius:8px;border:1px solid #ccc;font-size:16px}
  button{padding:12px 20px;background:#2E75B6;color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-weight:bold}
  #result{background:white;padding:20px;border-radius:12px;margin-top:20px;min-height:60px;border:1px solid #e0e6ef}
  .loading{color:#2E75B6;font-weight:bold;text-align:center}
  .error{color:#b91c1c;background:#fef2f2;padding:10px;border-radius:6px}
</style>
</head>
<body>

<h1>₿ Live Bitcoin Price</h1>

<div class="row">
  <input id="coinInput" type="text" placeholder="Enter coin: bitcoin, ethereum" value="bitcoin">
  <button id="searchBtn">Search</button>
</div>

<div id="result">Click Search to load. Try bitcoin.</div>

<script>
// Make it global so button can find it
window.loadData = async function() {
  const coin = (document.getElementById("coinInput").value.trim() || "bitcoin").toLowerCase();
  const resultDiv = document.getElementById("result");
  
  resultDiv.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coin}&vs_currencies=usd,kes&include_24hr_change=true`);
    if (!response.ok) throw new Error(`Status ${response.status}`);
    
    const data = await response.json();
    
    if (!data[coin] || data[coin].usd === undefined) {
      throw new Error(`Coin "${coin}" not found. Try bitcoin, ethereum, solana`);
    }

    resultDiv.innerHTML = `<h2>${coin.toUpperCase()}</h2>
      <p><strong>USD:</strong> $${data[coin].usd.toLocaleString()}</p>
      <p><strong>KES:</strong> KSh ${data[coin].kes.toLocaleString()}</p>
      <p><strong>24h:</strong> ${data[coin].usd_24h_change.toFixed(2)}%</p>`;
      
  } catch (err) {
    resultDiv.innerHTML = `<div class="error">Error: ${err.message}. Check internet.</div>`;
  }
};

// Connect button BOTH ways - this fixes your click issue
document.getElementById("searchBtn").addEventListener("click", window.loadData);
document.getElementById("coinInput").addEventListener("keypress", (e)=>{
  if(e.key==="Enter") window.loadData();
});
</script>

</body>
</html>
